name: Check Rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check default members
        run: cargo check --all-targets --all-features

      - name: Check format adapters
        run: |

  rust-test:
    name: Rust Test (${{ matrix.os }}, ${{ matrix.feature }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        feature: [no-default, default, all]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests (no feature)
        if: matrix.feature == 'no-default'
        run: cargo test --lib --tests --no-default-features --no-fail-fast

      - name: Run tests (default features)
        if: matrix.feature == 'default'
        run: cargo test --lib --tests --no-fail-fast

      - name: Run tests (all features)
        if: matrix.feature == 'all'
        run: cargo test --lib --tests --all-features --no-fail-fast

      - name: Test compression adapters
        if: matrix.feature == 'all'
        run: |
          cargo test -p acorn-codec --all-features --test main --no-fail-fast
