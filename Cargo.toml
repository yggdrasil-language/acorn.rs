[workspace]
resolver = "2"
members = ["projects/*", "examples/*"]
default-members = [
    "projects/acorn-core",
    "projects/acorn-source",
    "projects/acorn-codec",
    "projects/acorn",
    "projects/acorn-probe",
    "examples/acorn-zip",
    "examples/acorn-docx",
    "examples/acorn-epub",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
version = "0.0.1"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2024"
license = "MPL-2.0"
homepage = "https://github.com/yggdrasil-language/acorn.rs"
repository = "https://github.com/yggdrasil-language/acorn.rs"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
boost-diagnostic = { path = "../rust-boost/projects/boost-diagnostic", default-features = false, features = ["std", "serde"] }

acorn-core = { path = "projects/acorn-core" }
acorn-source = { path = "projects/acorn-source" }
acorn-codec = { path = "projects/acorn-codec" }
acorn = { path = "projects/acorn" }
acorn-probe = { path = "projects/acorn-probe" }
acorn-zip = { path = "examples/acorn-zip" }
acorn-cfb = { path = "examples/acorn-cfb" }
acorn-doc = { path = "examples/acorn-doc" }
acorn-docx = { path = "examples/acorn-docx" }
acorn-epub = { path = "examples/acorn-epub" }
acorn-wasm = { path = "examples/acorn-wasm" }
acorn-jvm = { path = "examples/acorn-jvm" }
acorn-pe = { path = "examples/acorn-pe" }

oak-core = { path = "../oaks/projects/oak-core", default-features = false, features = ["serde"] }
oak-xml = { path = "../oaks/examples/oak-xml", default-features = false, features = ["serde"] }

[profile.release]
lto = true
panic = "abort"
