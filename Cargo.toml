[workspace]
resolver = "2"
members = ["projects/*"]
default-members = [
    "projects/acorn-core",
    "projects/acorn-diagnostic",
    "projects/acorn-source",
    "projects/acorn-probe",
]
exclude = [
    "projects/.DS_Store",
    "projects/syntax-error",
]

[workspace.package]
version = "0.0.1"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2021"
license = "MPL-2.0"
homepage = "https://github.com/yggdrasil-language/acorn.rs"
repository = "https://github.com/yggdrasil-language/acorn.rs"

[workspace.dependencies]
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }

# Git `branch = "dev"` for CI and published consumers. Local path overlay: `.cargo/config.toml`.
acorn-diagnostic = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev", package = "acorn-diagnostic" }
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev", package = "acorn-core" }
acorn-source = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev", package = "acorn-source" }
acorn-probe = { git = "https://github.com/yggdrasil-language/acorn.rs.git", branch = "dev", package = "acorn-probe" }

[profile.release]
lto = true
panic = "abort"
