[workspace]
resolver = "2"
members = ["projects/*"]
default-members = [
    "projects/acorn-core",
    "projects/acorn-diagnostic",
    "projects/acorn-source",
    "projects/syntax-error",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
version = "0.0.1"
authors = ["Yggdrasill Team <192607617@qq.com>"]
edition = "2021"
license = "MPL-2.0"
homepage = "https://github.com/oovm/acorn.rs"
repository = "https://github.com/oovm/acorn.rs"

[workspace.dependencies]
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }

acorn-diagnostic = { path = "projects/acorn-diagnostic", version = "0.0.1" }
acorn-core = { path = "projects/acorn-core", version = "0.0.1" }
acorn-source = { path = "projects/acorn-source", version = "0.0.1" }

[profile.release]
lto = true
panic = "abort"
