# Local path overlay for workspace crates.
# Committed `Cargo.toml` pins Oak by git `rev` so CI and fresh clones resolve from remote.
# This patch keeps sibling `projects/*` crates on disk during local development.

[patch."https://github.com/oovm/rust-boost"]
boost-diagnostic = { path = "<your-path>/rust-boost/projects/boost-diagnostic" }

[patch."https://github.com/yggdrasil-language/oaks.git"]
oak-core = { path = "<your-path>/oaks/projects/oak-core" }
oak-xml = { path = "<your-path>/oaks/examples/oak-xml" }
oak-xpath = { path = "<your-path>/oaks/examples/oak-xpath" }
